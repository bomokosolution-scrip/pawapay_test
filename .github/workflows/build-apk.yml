name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Générer les dossiers Android
        run: |
          flutter create --platforms=android --project-name pawapay_test .
          rm -rf test
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --dart-define=PAWAPAY_TOKEN=${{ secrets.PAWAPAY_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: pawapay-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
